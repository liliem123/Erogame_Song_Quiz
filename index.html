<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EROGE SONG QUIZ</title>
  <link rel="stylesheet" href="./style.css?v=101">
</head>
<body>
<main>
  <header class="topbar">
    <div>
      <h1>EROGE SONG QUIZ</h1>
      <p>에로게 주제가를 듣고 작품 제목과 곡 제목을 맞혀보세요.</p>
    </div>
    <div class="top-controls">
      <div class="mode-switch">
        <button id="modeAll" class="mode-btn active" type="button">전체 랜덤</button>
        <button id="modeYear" class="mode-btn" type="button">연도별</button>
      </div>
      <select id="yearSelect" hidden></select>
      <div class="score"><b id="score">0</b><span>점</span></div>
    </div>
  </header>

  <section class="card" id="empty" hidden>
    <h2>출제 가능한 데이터가 없습니다.</h2>
    <p>data/quiz.json을 확인해주세요.</p>
  </section>

  <section class="card game-card" id="game" hidden>
    <div class="game-meta">
      <span id="progress"></span>
      <strong id="type"></strong>
      <span id="yearBadge"></span>
    </div>

    <div class="horizontal-layout">
      <section class="media-panel">
        <div class="youtube-visual-shell" id="youtubeVisualShell">
          <div class="video-curtain" id="videoCurtain">
            <div class="musicmark">♪</div>
            <b>음악 듣기</b>
            <span>영상은 정답 공개 후 표시됩니다</span>
            <span id="candidateText">YouTube 후보 준비 중...</span>
          </div>
          <div class="youtube-compact" id="youtubeCompact">
            <div id="player"></div>
          </div>
        </div>

        <div class="player-tools">
          <button id="audioPlay" type="button">▶ 재생</button>
          <button id="audioPause" type="button">⏸ 일시정지</button>
          <button id="audioRestart" type="button">↺ 처음부터</button>
          <label>볼륨
            <input id="volume" type="range" min="0" max="100" value="70">
          </label>
        </div>
        <div class="player-status">
          <span id="playerStatus">YouTube API 로딩 중...</span>
          <span id="diag"></span>
        </div>
      </section>

      <section class="answer-panel">
        <div class="answer-group">
          <label>작품 제목 <span>+1점</span></label>
          <div class="answer-row">
            <div class="autocomplete-wrap">
              <input id="animeInput" autocomplete="off" placeholder="작품 제목 입력">
              <div class="suggestions" id="animeSuggestions" hidden></div>
            </div>
            <button data-check="anime">확인</button>
          </div>
          <div class="feedback" id="animeFeedback"></div>
        </div>

        <div class="answer-group">
          <label>곡 제목 <span>+1점</span></label>
          <div class="answer-row">
            <div class="autocomplete-wrap">
              <input id="songInput" autocomplete="off" placeholder="곡 제목 입력">
              <div class="suggestions" id="songSuggestions" hidden></div>
            </div>
            <button data-check="song">확인</button>
          </div>
          <div class="feedback" id="songFeedback"></div>
        </div>

        <div class="hintline">
          <button class="ghost" id="vocalHint" type="button">보컬 힌트</button>
          <span id="vocalHintText"></span>
        </div>

        <div class="actions">
          <button class="ghost" id="reveal" type="button">정답 공개</button>
          <button class="primary" id="next" type="button" disabled>다음 문제</button>
        </div>

        <div class="answerbox" id="answerbox" hidden>
          <div class="answer-image-wrap">
            <img id="answerImage" alt="에로게 대표 이미지" hidden>
            <div id="imageFallback" class="image-fallback">대표 이미지 없음</div>
          </div>
          <div class="answer-info">
            <div><span>작품</span><b id="answerAnime"></b></div>
            <div><span>곡</span><b id="answerSong"></b></div>
            <div><span>보컬</span><b id="answerVocal"></b></div>
            <div><span>연도</span><b id="answerYear"></b></div>
          </div>
        </div>
      </section>
    </div>
  </section>

  <section class="card completion-card" id="complete" hidden>
    <h2>퀴즈 완료!</h2>
    <p>모든 문제를 완료했습니다.</p>
    <div class="completion-score"><b id="finalScore">0</b><span id="finalMax"> / 0점</span></div>
    <button id="restartQuiz" class="primary completion-restart" type="button">처음부터 다시 하기</button>
  </section>
</main>

<script src="./app.js?v=101"></script>
</body>
</html>
